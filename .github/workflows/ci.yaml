name: Checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit cancels a branch or pull request run that is still going; main runs always
# finish, because the release gate needs a successful run for every commit it may release.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.PANKO_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Unit tests and lint
        run: make test-unit lint lint-go
      - name: Release gate tests
        run: node --test .github/scripts/release-gate.test.cjs

  e2e:
    needs: unit
    # The 45-minute lab runs once per pull request commit and once per main commit (the release
    # gate requires it), not on every branch push; workflow_dispatch starts it by hand.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.PANKO_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      # The lab images are imported, not pullable; near a full disk the kubelet garbage-collects them.
      - name: Free disk space
        if: runner.environment != 'self-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Build local lab and run lifecycle, RBAC and gateway tests
        run: |
          mkdir -p .local
          make cluster-up bootstrap build deploy
          # All images are built and imported; release the Go build layers.
          docker builder prune --all --force
          df -h /
          make test
      - name: Collect diagnostics
        if: failure()
        env:
          KUBECONFIG: ${{ github.workspace }}/.local/kubeconfig
        run: |
          mkdir -p .local/diagnostics
          df -h > .local/diagnostics/disk.txt 2>&1 || true
          docker system df > .local/diagnostics/docker-disk.txt 2>&1 || true
          kubectl describe nodes > .local/diagnostics/nodes.txt 2>&1 || true
          kubectl get pods,jobs,databases -A -o wide > .local/diagnostics/resources.txt 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > .local/diagnostics/events.txt 2>&1 || true
          for ns in infra-runners infra-gateway team-a team-b; do
            kubectl -n "$ns" logs --all-containers --prefix -l app=database-hook > ".local/diagnostics/$ns-hook.log" 2>&1 || true
            kubectl -n "$ns" logs --all-containers --prefix -l app=platform-gateway > ".local/diagnostics/$ns-gateway.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lab-diagnostics
          path: .local/diagnostics/
      - name: Remove test cluster
        if: always()
        run: make cluster-down
