name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tested main commit
    runs-on: ${{ vars.PANKO_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.checks.outputs.tag }}
      sha: ${{ steps.checks.outputs.sha }}
      prerelease: ${{ steps.checks.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to belong to main
        id: commit
        run: |
          git merge-base --is-ancestor HEAD origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require successful CI for this exact commit
        id: checks
        uses: actions/github-script@v9
        env:
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            const gate = require('./.github/scripts/release-gate.cjs');
            await gate({ github, context, core, sha: process.env.RELEASE_SHA });

  binaries:
    needs: verify
    runs-on: ${{ vars.PANKO_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          # Keep aligned with mise.toml and Dockerfile.server.
          go-version: '1.27.3'
      - name: Build and package CLI and administrator commands
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          mkdir -p staging dist
          suffix=''
          if [ "$GOOS" = windows ]; then suffix='.exe'; fi
          go build -trimpath -ldflags="-s -w -X main.version=$RELEASE_TAG" -o "staging/panko$suffix" ./cmd/panko
          go build -trimpath -ldflags="-s -w -X main.version=$RELEASE_TAG" -o "staging/panko-admin$suffix" ./cmd/admin
          cp LICENSE README.md CHANGELOG.md staging/
          archive="panko_${RELEASE_TAG#v}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = windows ]; then
            (cd staging && zip -q "../dist/$archive.zip" ./*)
          else
            tar -czf "dist/$archive.tar.gz" -C staging .
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  images:
    needs: verify
    runs-on: ${{ vars.PANKO_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One image for every in-cluster role of panko-server; the chart selects the role.
          - component: server
            file: Dockerfile.server
          - component: module-mirror
            file: cluster/Dockerfile.module-mirror
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMPONENT: ${{ matrix.component }}
        run: echo "name=ghcr.io/${REPOSITORY,,}-$COMPONENT" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: VERSION=${{ needs.verify.outputs.tag }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ needs.verify.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.tag }}
            org.opencontainers.image.licenses=Apache-2.0

  publish:
    name: Publish GitHub release
    needs: [verify, binaries, images]
    runs-on: ${{ vars.PANKO_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - name: Publish archives and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS && sha256sum --check SHA256SUMS)
          python3 tools/release_homebrew.py "${RELEASE_TAG#v}" dist/SHA256SUMS > dist/panko.rb
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          notes="docs/release-notes/$RELEASE_TAG.md"
          if [ -f "$notes" ]; then flags+=(--notes-file "$notes"); else flags+=(--generate-notes); fi
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "$RELEASE_TAG" "${flags[@]}" dist/*
