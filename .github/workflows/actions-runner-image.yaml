name: Actions runner image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/runner/Dockerfile
      - .github/workflows/actions-runner-image.yaml

permissions:
  contents: read
  packages: write

concurrency:
  group: actions-runner-image
  cancel-in-progress: false

jobs:
  image:
    # Bootstrap/recovery image build: must work before the self-hosted set exists.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/runner/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/hingst-it/panko-actions-runner:2.338.1-1
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Verify runner tools as the unprivileged runner user
        run: |
          docker run --rm --entrypoint /bin/bash ghcr.io/hingst-it/panko-actions-runner:2.338.1-1 -ec '
            test "$(id -u)" = 1001
            gh --version
            node --version
            python3 -m venv /tmp/test-venv
            docker --version
            make --version
            zip -v >/dev/null
          '
      - name: Publish verified image
        run: docker push ghcr.io/hingst-it/panko-actions-runner:2.338.1-1
