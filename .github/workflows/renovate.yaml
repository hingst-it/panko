name: Renovate

# Weekly dependency updates. Renovate authenticates as the panko-renovate
# GitHub App; the workflow mints a short-lived installation token per run, so
# no long-lived PAT exists. main only accepts pull requests (ruleset), so every
# update arrives as a PR for review.
on:
  schedule:
    # Weekdays 04:30 UTC, before the working day in Europe/Berlin. Daily so
    # freed PR slots (prConcurrentLimit) refill the next morning; every PR
    # runs the ~40 min e2e job on the panko runners, hence the low limits.
    - cron: "30 4 * * 1-5"
  workflow_dispatch:
    inputs:
      log_level:
        description: Renovate log level
        type: choice
        options: [info, debug]
        default: info

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ${{ vars.PANKO_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - name: Mint panko-renovate token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          repositories: panko

      - name: Renovate
        uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          # Commits through the API so they show as verified by the App.
          RENOVATE_PLATFORM_COMMIT: enabled
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
