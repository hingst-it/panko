apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-gateway
  namespace: infra-runners
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-gateway
  namespace: infra-runners
spec:
  replicas: 1
  selector:
    matchLabels: {app: platform-gateway}
  template:
    metadata:
      labels: {app: platform-gateway}
    spec:
      serviceAccountName: platform-gateway
      securityContext: {runAsNonRoot: true, runAsUser: 1000}
      containers:
        - name: gateway
          image: panko-gateway:dev
          imagePullPolicy: Never
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: tokens, mountPath: /etc/panko, readOnly: true}
      volumes:
        - name: tokens
          secret: {secretName: gateway-auth}
---
apiVersion: v1
kind: Service
metadata:
  name: platform-gateway
  namespace: infra-runners
spec:
  selector: {app: platform-gateway}
  ports: [{port: 8080, targetPort: 8080}]
