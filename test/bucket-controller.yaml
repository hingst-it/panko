# Test-only controller for Buckets; the same hook serves them like Databases, over the
# controller pod's loopback address like the chart's database-controller.
apiVersion: metacontroller.k8s.io/v1alpha1
kind: CompositeController
metadata:
  name: bucket-controller
  # The embedded Metacontroller only manages controllers with this label.
  labels:
    platform.example.com/controller: panko
spec:
  generateSelector: true
  resyncPeriodSeconds: 30
  parentResource:
    apiVersion: platform.example.com/v1
    resource: buckets
  childResources:
    - apiVersion: batch/v1
      resource: jobs
      updateStrategy:
        method: OnDelete
    - apiVersion: platform.example.com/v1
      resource: runs
      updateStrategy:
        method: OnDelete
  hooks:
    customize:
      webhook:
        url: http://127.0.0.1:8090/customize
        timeout: 10s
    sync:
      webhook:
        url: http://127.0.0.1:8090/sync
        timeout: 10s
    finalize:
      webhook:
        url: http://127.0.0.1:8090/finalize
        timeout: 10s
