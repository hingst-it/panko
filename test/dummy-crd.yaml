apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.platform.example.com
  labels:
    platform.example.com/expose: "true"
spec:
  group: platform.example.com
  scope: Namespaced
  names:
    plural: widgets
    singular: widget
    kind: Widget
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: Dummy resource proving automatic CRD discovery without gateway code changes.
          required: [spec]
          properties:
            metadata:
              type: object
            spec:
              type: object
              required: [color]
              description: Automatically exposed widget settings.
              properties:
                color:
                  type: string
                  description: Widget color, documented only in the CRD.
                  enum: [red, blue]
