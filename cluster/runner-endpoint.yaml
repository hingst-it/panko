apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner-endpoint
  namespace: infra-runners
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner-endpoint
  namespace: infra-runners
spec:
  replicas: 2
  selector:
    matchLabels: {app: runner-endpoint}
  template:
    metadata:
      labels: {app: runner-endpoint}
    spec:
      serviceAccountName: runner-endpoint
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      containers:
        - name: endpoint
          image: panko-runner-endpoint:dev
          imagePullPolicy: Never
          env:
            - {name: TLS_CERT_FILE, value: /etc/endpoint-tls/tls.crt}
            - {name: TLS_KEY_FILE, value: /etc/endpoint-tls/tls.key}
          ports: [{name: https, containerPort: 8443}]
          readinessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
          livenessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: tls, mountPath: /etc/endpoint-tls, readOnly: true}
      volumes:
        - name: tls
          secret: {secretName: panko-runner-endpoint-tls, defaultMode: 0440}
---
apiVersion: v1
kind: Service
metadata:
  name: runner-endpoint
  namespace: infra-runners
spec:
  selector: {app: runner-endpoint}
  ports: [{name: https, port: 443, targetPort: https}]
---
apiVersion: v1
kind: Service
metadata:
  name: runner-endpoint-lab
  namespace: infra-runners
spec:
  type: NodePort
  selector: {app: runner-endpoint}
  ports: [{name: https, port: 443, targetPort: https, nodePort: 30443}]
