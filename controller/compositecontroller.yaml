apiVersion: metacontroller.k8s.io/v1alpha1
kind: CompositeController
metadata:
  name: database-controller
spec:
  generateSelector: true
  resyncPeriodSeconds: 30
  parentResource:
    apiVersion: platform.example.com/v1
    resource: databases
  childResources:
    - apiVersion: batch/v1
      resource: jobs
      updateStrategy:
        method: OnDelete
    # Executions of resources bound to a remote runner pool; the runner endpoint owns their status.
    - apiVersion: platform.example.com/v1
      resource: runs
      updateStrategy:
        method: OnDelete
  hooks:
    # Selects the StateBackend and BackendProfiles a Database needs; the hook itself has no API access.
    customize:
      webhook:
        url: http://database-hook.infra-runners.svc:8080/customize
        timeout: 10s
    sync:
      webhook:
        url: http://database-hook.infra-runners.svc:8080/sync
        timeout: 10s
    finalize:
      webhook:
        url: http://database-hook.infra-runners.svc:8080/finalize
        timeout: 10s
