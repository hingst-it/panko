# BackendProfile: an operator-approved state destination, published into a team namespace.
# Only typed fields are accepted; teams cannot set endpoints, keys or credentials here.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backendprofiles.platform.example.com
spec:
  group: platform.example.com
  scope: Namespaced
  names:
    plural: backendprofiles
    singular: backendprofile
    kind: BackendProfile
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - {name: Type, type: string, jsonPath: .spec.type}
        - {name: Bucket, type: string, jsonPath: .spec.s3.bucket}
      schema:
        openAPIV3Schema:
          type: object
          description: Operator-approved OpenTofu state destination.
          required: [spec]
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [type]
              x-kubernetes-validations:
                - rule: self.type != 's3' || has(self.s3)
                  message: s3 profiles require s3 settings
              properties:
                type:
                  type: string
                  enum: [s3]
                  description: Backend type. Only s3 is supported besides the built-in Kubernetes fallback.
                s3:
                  type: object
                  required: [bucket, region]
                  properties:
                    bucket:
                      type: string
                      minLength: 3
                      maxLength: 63
                      pattern: '^[a-z0-9][a-z0-9.-]*[a-z0-9]$'
                      description: Bucket that holds the states.
                    region:
                      type: string
                      minLength: 1
                      description: Bucket region.
                    keyPrefix:
                      type: string
                      maxLength: 128
                      pattern: '^[A-Za-z0-9!_.*()-]+(/[A-Za-z0-9!_.*()-]+)*$'
                      description: Prefix under which Panko derives <installation>/<uid>/terraform.tfstate.
                    endpoint:
                      type: string
                      pattern: '^https?://[a-z0-9.-]+(:[0-9]+)?$'
                      description: S3-compatible endpoint approved by the operator; omit for AWS.
                    usePathStyle:
                      type: boolean
                      description: Path-style addressing for S3-compatible endpoints.
                    encrypt:
                      type: boolean
                      description: Server-side encryption of the state object.
---
# StateBackend: a team's named selection of a profile and the credentials to use.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: statebackends.platform.example.com
  labels:
    platform.example.com/expose: "true"
spec:
  group: platform.example.com
  scope: Namespaced
  names:
    plural: statebackends
    singular: statebackend
    kind: StateBackend
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - {name: Profile, type: string, jsonPath: .spec.profileRef.name}
      schema:
        openAPIV3Schema:
          type: object
          description: A team's choice of an approved state destination. Resources bind to it once; later changes do not move existing state.
          required: [spec]
          properties:
            apiVersion:
              type: string
              description: Kubernetes API group and version.
            kind:
              type: string
              description: Kubernetes resource kind.
            metadata:
              type: object
            spec:
              type: object
              description: Selected profile and credentials.
              required: [profileRef, credentialsSecretRef]
              properties:
                profileRef:
                  type: object
                  description: BackendProfile in this namespace, published by an operator.
                  required: [name]
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 63
                      description: Name of the BackendProfile.
                credentialsSecretRef:
                  type: object
                  description: Secret in this namespace with access_key_id and secret_access_key, provided by an operator.
                  required: [name]
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                      description: Name of the Secret.
