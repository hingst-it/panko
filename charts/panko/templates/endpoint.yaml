{{- if .Values.endpoint.enabled }}
{{- /* Endpoint role: remote agents claim Runs and commit artifacts. Kubernetes RBAC cannot limit
create by name, so the endpoint derives every storage name from the Run itself. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner-endpoint
  namespace: infra-runners
  labels:
    {{- include "panko.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runner-endpoint
  labels:
    {{- include "panko.labels" . | nindent 4 }}
rules:
  - {apiGroups: [platform.example.com], resources: [runs], verbs: [get, list, watch]}
  - {apiGroups: [platform.example.com], resources: [runs/status], verbs: [update]}
  - {apiGroups: [platform.example.com], resources: [databases], verbs: [get]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: runner-endpoint
  labels:
    {{- include "panko.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: runner-endpoint}
subjects:
  - {kind: ServiceAccount, name: runner-endpoint, namespace: infra-runners}
{{- /* Per-team access is retained when a team is removed, like the runner identity, so remote
Runs of its remaining resources can still commit. */}}
{{- range .Values.installation.teams }}
{{- range list . (printf "panko-state-%s" .) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runner-endpoint
  namespace: {{ . }}
  labels:
    {{- include "panko.labels" $ | nindent 4 }}
  annotations:
    {{- include "panko.retain" $ | nindent 4 }}
rules:
  - {apiGroups: [""], resources: [secrets], verbs: [get, create, update, delete]}
  {{- if not (hasPrefix "panko-state-" .) }}
  - {apiGroups: [""], resources: [configmaps], verbs: [get, create, update]}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runner-endpoint
  namespace: {{ . }}
  labels:
    {{- include "panko.labels" $ | nindent 4 }}
  annotations:
    {{- include "panko.retain" $ | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: runner-endpoint}
subjects:
  - {kind: ServiceAccount, name: runner-endpoint, namespace: infra-runners}
{{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runner-endpoint
  namespace: infra-runners
  labels:
    {{- include "panko.labels" . | nindent 4 }}
rules:
  - {apiGroups: [""], resources: [secrets], resourceNames: [panko-runner-agents], verbs: [get]}
  - {apiGroups: [""], resources: [configmaps], resourceNames: [panko-installation, panko-runner-pause], verbs: [get]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runner-endpoint
  namespace: infra-runners
  labels:
    {{- include "panko.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: runner-endpoint}
subjects:
  - {kind: ServiceAccount, name: runner-endpoint, namespace: infra-runners}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner-endpoint
  namespace: infra-runners
  labels:
    app: runner-endpoint
    app.kubernetes.io/component: endpoint
    {{- include "panko.labels" . | nindent 4 }}
spec:
  # One replica is enough for a personal installation; claims and commits are safe with more.
  replicas: 1
  selector:
    matchLabels: {app: runner-endpoint}
  template:
    metadata:
      labels:
        app: runner-endpoint
        app.kubernetes.io/component: endpoint
    spec:
      serviceAccountName: runner-endpoint
      securityContext:
        {{- include "panko.podSecurity" . | nindent 8 }}
      {{- include "panko.pullSecrets" . | nindent 6 }}
      containers:
        - name: endpoint
          image: {{ include "panko.serverImage" . }}
          imagePullPolicy: {{ .Values.images.server.pullPolicy }}
          args: [endpoint]
          env:
            - {name: TLS_CERT_FILE, value: /etc/endpoint-tls/tls.crt}
            - {name: TLS_KEY_FILE, value: /etc/endpoint-tls/tls.key}
          ports: [{name: https, containerPort: 8443}]
          readinessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
          livenessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
          securityContext:
            {{- include "panko.restricted" . | nindent 12 }}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: tls, mountPath: /etc/endpoint-tls, readOnly: true}
      volumes:
        - name: tls
          secret: {secretName: runner-endpoint-tls, defaultMode: 0440}
---
apiVersion: v1
kind: Service
metadata:
  name: runner-endpoint
  namespace: infra-runners
  labels:
    {{- include "panko.labels" . | nindent 4 }}
spec:
  selector: {app: runner-endpoint}
  ports: [{name: https, port: 443, targetPort: https}]
{{- with .Values.endpoint.labNodePort }}
---
apiVersion: v1
kind: Service
metadata:
  name: runner-endpoint-lab
  namespace: infra-runners
  labels:
    {{- include "panko.labels" $ | nindent 4 }}
spec:
  type: NodePort
  selector: {app: runner-endpoint}
  ports: [{name: https, port: 443, targetPort: https, nodePort: {{ . }}}]
{{- end }}
{{- end }}
