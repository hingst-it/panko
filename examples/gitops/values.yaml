# Example values for an existing cluster managed with GitOps (helm template, Argo CD, Flux).
# No real credentials belong here: the chart never renders Secrets. Keep this file in your own
# GitOps repository and pin every version.

installation:
  # Team namespaces <team> and panko-state-<team> are created by the chart and kept on uninstall.
  teams: [team-a, team-b]
  # Lab S3 gateway: off for a shared cluster; teams use operator-approved BackendProfiles instead.
  s3: false
  # Runner pods may reach only Panko's components and these targets (policies kept by setup).
  egress: true
  egressTargets:
    - {service: infra-backends/postgres, port: 5432}
  runnerPools: []
  runnerEndpoint:
    names: []

images:
  # Published release images (anonymous pulls from ghcr.io). The tags default to the chart's
  # appVersion, so pinning the chart version pins the images. To mirror them into your own
  # registry, set repository and an explicit tag (or a digest-pinned tag).
  server:
    repository: ghcr.io/hingst-it/panko-server
    pullPolicy: IfNotPresent
  moduleMirror:
    repository: ghcr.io/hingst-it/panko-module-mirror
    pullPolicy: IfNotPresent
  # Pull secret names in infra-runners, infra-gateway, infra-backends and every team namespace,
  # created outside the chart; runner Jobs use them through the teams' tofu-runner accounts.
  pullSecrets: []

module:
  repository: https://github.com/hingst-it/panko-database.git
  # A full commit SHA; changing it rolls the module out (rollout: auto) or waits (manual).
  revision: 8304ffda663aa0943890cd1d8966a8c50b1fdc05
  rollout: manual

lab:
  # The example module needs PostgreSQL. With an external server, disable the lab instance and
  # provide infra-backends/postgres-admin (key: password) before the first sync.
  postgres:
    enabled: true

secrets:
  # true: the setup Job creates missing credentials once and never rotates them on re-render.
  # false: provide every Secret yourself (SOPS, External Secrets, cert-manager); setup verifies.
  generate: true
