# Flux OCIRepository and HelmRelease installing Panko from the published OCI chart. Validated
# against Flux v2.10.0 by test/release_acceptance.py (gitops phase); see docs/gitops.md.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: panko
  namespace: flux-system
spec:
  interval: 10m
  url: oci://ghcr.io/hingst-it/charts/panko
  # The chart version also pins the images (their tags default to appVersion).
  ref:
    tag: 0.0.2
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: panko
  namespace: flux-system
spec:
  interval: 30m
  releaseName: panko
  # The release record lives in panko-system; the objects carry their own namespaces.
  targetNamespace: panko-system
  storageNamespace: panko-system
  chartRef:
    kind: OCIRepository
    name: panko
  install:
    createNamespace: true
    # Helm itself never upgrades crds/; Flux creates and replaces them explicitly.
    crds: CreateReplace
    timeout: 15m
  upgrade:
    crds: CreateReplace
    timeout: 15m
    # Panko keeps state in its own objects; retry instead of rolling back.
    remediation:
      retries: 3
      remediateLastFailure: false
  # Values from your own repository, e.g. a ConfigMap generated from examples/gitops/values.yaml.
  valuesFrom:
    - kind: ConfigMap
      name: panko-values
      valuesKey: values.yaml
